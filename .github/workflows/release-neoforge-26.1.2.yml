name: Release NeoForge 26.1.2

on:
  push:
    branches:
      - '26.1.2'
    paths:
      - '.github/workflows/release-neoforge-26.1.2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.3_0.4+26.1.2
          target_commitish: ${{ github.sha }}
          name: Chest Tracker 2.8.3_0.4 — NeoForge 26.1.2
          prerelease: true
          generate_release_notes: false
          body: |
            Unofficial NeoForge port of Chest Tracker for Minecraft 26.1.2.

            Requirements:
            - Minecraft 26.1.2
            - NeoForge 26.1.2.95 or newer
            - YACL 3.9.1+26.1 for NeoForge

            ## Changes since 2.8.3_0.3

            - Added a separate **Enhanced Cleanup** setting.
            - Enhanced Cleanup checks remembered containers in loaded chunks before searches and when opening Chest Tracker.
            - Missing or broken containers found by Enhanced Cleanup are removed from the local database.
            - The original **Periodic Check** remains available as an independent setting.
            - Added shader-compatible 3D container highlights for Iris and shader packs such as Complementary Unbound.
            - Shader highlights use the same pulsing, fading, see-through boxes as the standard renderer.

            World labels and optional Litematica, Jade, WTHIT, ShulkerBoxTooltip and Searchables integrations are currently disabled.
          files: build/libs/chesttracker-2.8.3_0.4+26.1.2.jar
